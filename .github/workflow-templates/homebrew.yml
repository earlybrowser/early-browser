name: Homebrew distribution

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to distribute through Homebrew
        required: true
        type: string

permissions:
  contents: read

# Same group as Release. Do not synchronously call this workflow while the
# caller holds this group; use a single orchestrator or a separate later run.
concurrency:
  group: distribution
  cancel-in-progress: false

jobs:
  update-tap:
